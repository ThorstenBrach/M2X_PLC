<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Server in the PLC cycle</text>

  <!-- cycle column -->
  <g font-size="13">
    <rect x="40" y="60" width="300" height="60" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="190" y="85" text-anchor="middle" font-weight="600" fill="#14532d">1. fbStation()</text>
    <text x="190" y="104" text-anchor="middle" font-size="11" fill="#475569">receive requests · publish state / factsheet</text>

    <rect x="40" y="150" width="300" height="60" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="190" y="175" text-anchor="middle" font-weight="600" fill="#0f172a">2. fbMqtt()</text>
    <text x="190" y="194" text-anchor="middle" font-size="11" fill="#475569">MQTT connection (TF6701)</text>

    <rect x="40" y="240" width="300" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="190" y="265" text-anchor="middle" font-weight="600" fill="#0f172a">3. your station logic</text>
    <text x="60" y="290" font-size="12" fill="#334155" font-family="Consolas, Menlo, monospace">nPoint := fbStation.GetNextRequest(stReq);</text>
    <text x="60" y="308" font-size="12" fill="#334155" font-family="Consolas, Menlo, monospace">IF nPoint &gt; 0</text>
    <text x="60" y="326" font-size="12" fill="#334155" font-family="Consolas, Menlo, monospace">THEN</text>
    <text x="60" y="344" font-size="12" fill="#334155" font-family="Consolas, Menlo, monospace">  start job for stReq.RequestType</text>
    <text x="60" y="362" font-size="12" fill="#334155" font-family="Consolas, Menlo, monospace">END_IF</text>
    <text x="60" y="380" font-size="12" fill="#334155" font-family="Consolas, Menlo, monospace">job done → SetRequestStatus(…)</text>
  </g>
  <line x1="190" y1="120" x2="190" y2="148" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="190" y1="210" x2="190" y2="238" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M40,330 C0,330 0,90 38,90" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="14" y="215" font-size="11" fill="#475569" transform="rotate(-90 14 215)">next cycle</text>

  <!-- right side: what the library does -->
  <g font-size="12" fill="#0f172a">
    <rect x="420" y="60" width="440" height="330" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="640" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">What the library does for you</text>
    <text x="440" y="118">• checks request type, parameters and sequence</text>
    <text x="440" y="142">• rejects a second active request of the same sender</text>
    <text x="440" y="166">• answers requestFactsheet and requestCancel itself</text>
    <text x="440" y="190">• queues requestAccess while the point is busy (PENDING)</text>
    <text x="440" y="214">• publishes the state on every change, at least every 30 s</text>
    <text x="440" y="238">• last will: CONNECTION_BROKEN, Enable = FALSE: OFFLINE</text>
    <text x="440" y="262">• keeps finished / failed requests 60 s in the state</text>
    <text x="440" y="300" font-weight="600" fill="#1e3a8a">What you do</text>
    <text x="440" y="326">• take the next request with GetNextRequest()</text>
    <text x="440" y="350">• run the physical action (gate, conveyor, door …)</text>
    <text x="440" y="374">• report RUNNING / PAUSED / FINISHED / FAILED</text>
  </g>
  <text x="450" y="425" text-anchor="middle" font-size="11" fill="#64748b">Call the M2X FB before its transport so that the last will is set before the first connect.</text>
</svg>

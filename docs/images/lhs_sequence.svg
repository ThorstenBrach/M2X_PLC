<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="900" height="760" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Load handling – sequence</text>

  <!-- heads -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="40" y="50" width="160" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="120" y="70" fill="#1e3a8a">AMR</text>
    <text x="120" y="87" font-size="11" font-weight="400" fill="#475569">LhsClientFB</text>
    <rect x="290" y="50" width="140" height="46" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="360" y="78" fill="#0f172a">MQTT Broker</text>
    <rect x="500" y="50" width="160" height="46" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="580" y="70" fill="#14532d">Station</text>
    <text x="580" y="87" font-size="11" font-weight="400" fill="#475569">LhsServerFB</text>
    <rect x="710" y="50" width="160" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="790" y="70" fill="#0f172a">Station program</text>
    <text x="790" y="87" font-size="11" font-weight="400" fill="#475569">your code</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="120" y1="96" x2="120" y2="740"/>
    <line x1="360" y1="96" x2="360" y2="740"/>
    <line x1="580" y1="96" x2="580" y2="740"/>
    <line x1="790" y1="96" x2="790" y2="740"/>
  </g>

  <g font-size="12" fill="#1e293b">
    <!-- requestAccess -->
    <line x1="120" y1="130" x2="578" y2="130" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="240" y="122">requestAccess (session S1, LHP1, PICK)</text>
    <line x1="580" y1="160" x2="122" y2="160" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#a)"/>
    <text x="240" y="154" fill="#64748b">state: PENDING</text>
    <line x1="580" y1="190" x2="788" y2="190" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="600" y="183">GetNextRequest()</text>
    <rect x="732" y="202" width="116" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="790" y="219" text-anchor="middle" font-size="11">open gate,</text>
    <text x="790" y="234" text-anchor="middle" font-size="11">mute light curtain</text>
    <line x1="790" y1="262" x2="582" y2="262" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="600" y="255">SetRequestStatus(RUNNING)</text>
    <line x1="580" y1="282" x2="122" y2="282" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#a)"/>
    <text x="240" y="276" fill="#64748b">state: RUNNING</text>
    <line x1="790" y1="312" x2="582" y2="312" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="600" y="305">SetRequestStatus(FINISHED)</text>
    <line x1="580" y1="332" x2="122" y2="332" stroke="#16a34a" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="240" y="326" fill="#16a34a" font-weight="600">state: FINISHED → MR may enter</text>

    <rect x="62" y="348" width="116" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="120" y="368" text-anchor="middle" font-size="11">drive in</text>

    <!-- requestLoadTransfer -->
    <line x1="120" y1="404" x2="578" y2="404" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="240" y="396">requestLoadTransfer (S1)</text>
    <rect x="732" y="414" width="116" height="30" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="790" y="434" text-anchor="middle" font-size="11">conveyor on/off</text>
    <line x1="580" y1="464" x2="122" y2="464" stroke="#16a34a" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="240" y="458" fill="#16a34a" font-weight="600">state: FINISHED → load handed over</text>

    <!-- requestExit -->
    <line x1="120" y1="508" x2="578" y2="508" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="240" y="500">requestExit (S1)</text>
    <rect x="732" y="518" width="116" height="30" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="790" y="538" text-anchor="middle" font-size="11">check load, mute</text>
    <line x1="580" y1="568" x2="122" y2="568" stroke="#16a34a" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="240" y="562" fill="#16a34a" font-weight="600">state: FINISHED → MR may leave</text>

    <rect x="62" y="584" width="116" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="120" y="604" text-anchor="middle" font-size="11">drive out</text>

    <!-- requestRelease -->
    <line x1="120" y1="640" x2="578" y2="640" stroke="#1e293b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="240" y="632">requestRelease (S1)</text>
    <rect x="732" y="650" width="116" height="30" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="790" y="670" text-anchor="middle" font-size="11">close gate</text>
    <line x1="580" y1="700" x2="122" y2="700" stroke="#16a34a" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="240" y="694" fill="#16a34a" font-weight="600">state: FINISHED → point free for the next MR</text>
  </g>
  <text x="450" y="748" text-anchor="middle" font-size="11" fill="#64748b">Each request: GetNextRequest() → work → SetRequestStatus(). The state is published on every change and at least every 30 s.</text>
</svg>

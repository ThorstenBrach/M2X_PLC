<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="390" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Load handling point – sequence phases (LhsPhaseEnum)</text>

  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="30"  y="120" width="110" height="46" rx="23" fill="#f1f5f9" stroke="#64748b"/>
    <text x="85"  y="148" fill="#0f172a">IDLE</text>
    <rect x="180" y="120" width="140" height="46" rx="23" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="250" y="148" fill="#713f12">ACCESS_REQUESTED</text>
    <rect x="360" y="120" width="130" height="46" rx="23" fill="#dbeafe" stroke="#2563eb"/>
    <text x="425" y="148" fill="#1e3a8a">ACCESS_GRANTED</text>
    <rect x="530" y="120" width="150" height="46" rx="23" fill="#dbeafe" stroke="#2563eb"/>
    <text x="605" y="148" fill="#1e3a8a">LOAD_TRANSFERRED</text>
    <rect x="720" y="120" width="140" height="46" rx="23" fill="#dcfce7" stroke="#16a34a"/>
    <text x="790" y="148" fill="#14532d">EXIT_GRANTED</text>
    <rect x="455" y="200" width="110" height="46" rx="23" fill="#fee2e2" stroke="#dc2626"/>
    <text x="510" y="228" fill="#7f1d1d">FAILED</text>
  </g>

  <g font-size="11" fill="#475569" text-anchor="middle">
    <line x1="140" y1="143" x2="178" y2="143" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="160" y="110">access</text>
    <text x="160" y="96">delivered</text>
    <line x1="320" y1="143" x2="358" y2="143" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="340" y="110">FINISHED</text>
    <line x1="490" y1="143" x2="528" y2="143" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="509" y="96">loadTransfer</text>
    <text x="509" y="110">FINISHED</text>
    <line x1="680" y1="143" x2="718" y2="143" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="699" y="96">exit</text>
    <text x="699" y="110">FINISHED</text>
    <!-- exit directly after access (MR is active device) -->
    <path d="M425,120 C470,36 720,36 770,118" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <text x="600" y="54">exit FINISHED (MR transfers the load itself)</text>
    <!-- release back to idle -->
    <path d="M790,166 C790,350 85,350 85,168" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="230" y="340" fill="#16a34a" font-weight="600">release FINISHED → IDLE (from every phase)</text>
    <!-- failures -->
    <line x1="605" y1="166" x2="545" y2="198" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="650" y="196" fill="#dc2626">transfer / exit FAILED</text>
    <line x1="470" y1="200" x2="436" y2="168" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="370" y="214" fill="#2563eb">continueLoadTransfer</text>
    <text x="370" y="228" fill="#2563eb">FINISHED</text>
    <path d="M250,166 C250,210 140,210 100,168" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="180" y="222" fill="#dc2626">access FAILED / canceled</text>
  </g>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#64748b">A second requestAccess for the same point stays PENDING until the point is IDLE again.</text>
</svg>

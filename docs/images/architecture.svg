<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Library architecture</text>

  <!-- Application -->
  <rect x="40" y="52" width="820" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="450" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Your application</text>
  <text x="450" y="96" text-anchor="middle" font-size="12" fill="#475569">station / vehicle program: calls the FBs cyclically, answers requests, sends requests</text>

  <!-- M2XLibrary -->
  <rect x="40" y="124" width="820" height="246" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="150" font-size="15" font-weight="600" fill="#1e3a8a">M2XLibrary</text>
  <text x="840" y="150" text-anchor="end" font-size="12" fill="#1e3a8a">portable Structured Text – identical for all targets</text>

  <g font-size="12" fill="#0f172a">
    <rect x="60" y="164" width="380" height="74" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="250" y="186" text-anchor="middle" font-weight="600">Servers (device side)</text>
    <text x="250" y="203" text-anchor="middle" font-size="11" fill="#475569">LhsServerFB · DoorServerFB · ElevatorServerFB</text>
    <text x="250" y="218" text-anchor="middle" font-size="11" fill="#475569">SignalingDeviceServerFB · ChargingDeviceServerFB</text>
    <text x="250" y="233" text-anchor="middle" font-size="11" fill="#475569">TransportOrderServerFB</text>

    <rect x="460" y="164" width="380" height="74" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="650" y="186" text-anchor="middle" font-weight="600">Clients (FM / MR side)</text>
    <text x="650" y="206" text-anchor="middle" fill="#475569">LhsClientFB · DoorClientFB · SignalingDeviceClientFB · …</text>
    <text x="650" y="224" text-anchor="middle" fill="#475569">RequestFB (Execute / Busy / Done / Error)</text>

    <rect x="60" y="250" width="380" height="50" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="250" y="271" text-anchor="middle" font-weight="600">ServerBaseFB</text>
    <text x="250" y="289" text-anchor="middle" fill="#475569">request table · 1 active request per sender · errors · state</text>

    <rect x="460" y="250" width="380" height="50" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="650" y="271" text-anchor="middle" font-weight="600">ClientBaseFB</text>
    <text x="650" y="289" text-anchor="middle" fill="#475569">request ids (UUID) · status tracking · state / factsheet</text>

    <rect x="60" y="312" width="250" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="185" y="332" text-anchor="middle" font-weight="600">JSON</text>
    <text x="185" y="349" text-anchor="middle" fill="#475569">JsonWriterFB · JsonParserFB</text>

    <rect x="325" y="312" width="250" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="450" y="332" text-anchor="middle" font-weight="600">Core</text>
    <text x="450" y="349" text-anchor="middle" fill="#475569">topics · ISO 8601 · UUID · codecs</text>

    <rect x="590" y="312" width="250" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="715" y="332" text-anchor="middle" font-weight="600">ITransport</text>
    <text x="715" y="349" text-anchor="middle" fill="#475569">MqttTransportFB · MockTransportFB</text>
  </g>

  <!-- SysDep -->
  <rect x="40" y="386" width="820" height="72" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="60" y="410" font-size="15" font-weight="600" fill="#7c2d12">Placeholder M2XLibrarySysDep</text>
  <text x="840" y="410" text-anchor="end" font-size="12" fill="#7c2d12">same POU names and signatures on every target</text>
  <g font-size="12" fill="#0f172a">
    <rect x="60" y="420" width="380" height="30" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="250" y="440" text-anchor="middle">M2XLibrarySysDep_Tc – Beckhoff TwinCAT 3</text>
    <rect x="460" y="420" width="380" height="30" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="650" y="440" text-anchor="middle">M2XLibrarySysDep_3S – CODESYS (MQTT open)</text>
  </g>

  <!-- Platform -->
  <rect x="40" y="470" width="380" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="230" y="494" text-anchor="middle" font-size="12" fill="#334155">Tc3_IotBase (TF6701) · Tc2_System · Tc2_Utilities</text>
  <rect x="480" y="470" width="380" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="670" y="494" text-anchor="middle" font-size="12" fill="#334155">IIoT Libraries (MQTT Client) · SysMem · SysTime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Request lifecycle</text>

  <!-- start -->
  <circle cx="60" cy="170" r="10" fill="#0f172a"/>
  <text x="60" y="200" text-anchor="middle" font-size="11" fill="#475569">received</text>

  <!-- check -->
  <polygon points="170,140 220,170 170,200 120,170" fill="#f8fafc" stroke="#64748b"/>
  <text x="170" y="174" text-anchor="middle" font-size="12" fill="#0f172a">check</text>
  <line x1="70" y1="170" x2="118" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- states -->
  <g font-size="14" font-weight="600">
    <rect x="270" y="145" width="120" height="50" rx="25" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="330" y="175" text-anchor="middle" fill="#713f12">PENDING</text>
    <rect x="460" y="145" width="120" height="50" rx="25" fill="#dbeafe" stroke="#2563eb"/>
    <text x="520" y="175" text-anchor="middle" fill="#1e3a8a">RUNNING</text>
    <rect x="460" y="280" width="120" height="50" rx="25" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="520" y="310" text-anchor="middle" fill="#4c1d95">PAUSED</text>
    <rect x="700" y="80" width="140" height="50" rx="25" fill="#dcfce7" stroke="#16a34a"/>
    <text x="770" y="110" text-anchor="middle" fill="#14532d">FINISHED</text>
    <rect x="700" y="230" width="140" height="50" rx="25" fill="#fee2e2" stroke="#dc2626"/>
    <text x="770" y="260" text-anchor="middle" fill="#7f1d1d">FAILED</text>
  </g>

  <!-- check -> pending / failed -->
  <line x1="220" y1="170" x2="268" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="244" y="160" text-anchor="middle" font-size="11" fill="#475569">ok</text>
  <path d="M170,200 C170,370 640,372 720,282" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="330" y="360" font-size="11" fill="#dc2626">rejected: not supported · already active · sequence · parameter</text>

  <!-- pending -> running -->
  <line x1="390" y1="170" x2="458" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="424" y="160" text-anchor="middle" font-size="11" fill="#475569">start</text>
  <!-- pending -> finished (factsheet, quick requests) -->
  <path d="M330,145 C360,80 600,80 698,100" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="470" y="80" text-anchor="middle" font-size="11" fill="#475569">done immediately</text>
  <!-- running <-> paused -->
  <line x1="505" y1="195" x2="505" y2="278" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="535" y1="278" x2="535" y2="197" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="545" y="240" font-size="11" fill="#475569">pause / resume</text>
  <!-- running -> finished / failed -->
  <line x1="580" y1="160" x2="698" y2="115" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="580" y1="182" x2="698" y2="245" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- paused -> failed -->
  <line x1="580" y1="300" x2="698" y2="268" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- pending -> failed (cancel) -->
  <path d="M360,195 C400,250 600,262 698,258" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="400" y="272" font-size="11" fill="#475569">requestCancel</text>

  <text x="770" y="150" text-anchor="middle" font-size="11" fill="#64748b">final – kept in the state</text>
  <text x="770" y="166" text-anchor="middle" font-size="11" fill="#64748b">for REQUEST_RETENTION (60 s)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">M2X – Machine to X</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#475569">Mobile robots and peripherals talk via publish/subscribe (MQTT + JSON)</text>

  <!-- Upper layer -->
  <rect x="40" y="86" width="230" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="155" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Upper layer system</text>
  <text x="155" y="132" text-anchor="middle" font-size="12" fill="#475569">ERP · WMS · call button (PLC)</text>

  <!-- Clients -->
  <rect x="40" y="190" width="230" height="250" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">M2X Clients</text>
  <rect x="62" y="232" width="186" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="155" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Fleet management</text>
  <text x="155" y="275" text-anchor="middle" font-size="11" fill="#475569">central or on the vehicle</text>
  <rect x="62" y="300" width="186" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="155" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">AMR / AGV</text>
  <text x="155" y="343" text-anchor="middle" font-size="11" fill="#475569">e.g. PLC on board</text>
  <text x="155" y="384" text-anchor="middle" font-size="12" fill="#1e3a8a">send requests</text>
  <text x="155" y="402" text-anchor="middle" font-size="12" fill="#1e3a8a">read state + factsheet</text>
  <text x="155" y="424" text-anchor="middle" font-size="11" fill="#64748b">LhsClientFB, DoorClientFB, …</text>

  <!-- Broker -->
  <rect x="380" y="190" width="200" height="250" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">MQTT Broker</text>
  <text x="480" y="240" text-anchor="middle" font-size="12" fill="#475569">e.g. Mosquitto</text>
  <g font-size="11" fill="#334155" font-family="Consolas, Menlo, monospace">
    <text x="398" y="280">lhs/v1/lhs_1/</text>
    <text x="410" y="298">request</text>
    <text x="410" y="316">state      (retained)</text>
    <text x="410" y="334">factsheet  (retained)</text>
    <text x="398" y="366">door/v1/door_1/…</text>
    <text x="398" y="384">elevator/v1/elv_1/…</text>
    <text x="398" y="402">order/v1/fm_1/…</text>
  </g>

  <!-- Servers -->
  <rect x="690" y="86" width="230" height="354" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="805" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">M2X Servers</text>
  <g font-size="13" fill="#0f172a">
    <rect x="712" y="126" width="186" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="805" y="150" text-anchor="middle">Load handling station</text>
    <rect x="712" y="172" width="186" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="805" y="196" text-anchor="middle">Door / gate</text>
    <rect x="712" y="218" width="186" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="805" y="242" text-anchor="middle">Signaling device</text>
    <rect x="712" y="264" width="186" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="805" y="288" text-anchor="middle">Elevator (group)</text>
    <rect x="712" y="310" width="186" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="805" y="334" text-anchor="middle">Charging device</text>
    <rect x="712" y="356" width="186" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="805" y="380" text-anchor="middle">Transport order receiver</text>
  </g>
  <text x="805" y="424" text-anchor="middle" font-size="11" fill="#64748b">LhsServerFB, DoorServerFB, …</text>

  <!-- arrows -->
  <line x1="270" y1="270" x2="378" y2="270" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="324" y="262" text-anchor="middle" font-size="11" fill="#475569">request</text>
  <line x1="378" y1="330" x2="272" y2="330" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="324" y="322" text-anchor="middle" font-size="11" fill="#475569">state</text>
  <text x="324" y="348" text-anchor="middle" font-size="11" fill="#475569">factsheet</text>
  <line x1="580" y1="270" x2="688" y2="270" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="634" y="262" text-anchor="middle" font-size="11" fill="#475569">request</text>
  <line x1="688" y1="330" x2="582" y2="330" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="634" y="322" text-anchor="middle" font-size="11" fill="#475569">state</text>
  <text x="634" y="348" text-anchor="middle" font-size="11" fill="#475569">factsheet</text>
  <path d="M270,118 C330,118 340,180 378,214" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="330" y="150" font-size="11" fill="#475569">transport order</text>

  <text x="480" y="480" text-anchor="middle" font-size="12" fill="#64748b">The broker is not part of the PLC. Clients and servers are both MQTT clients of the same broker.</text>
</svg>
